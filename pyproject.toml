[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo_mts"
version = "0.2.0"
description = "RFSoC based Many-In-Many-Output Controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pynq==3.0.1",
    "smbus2==0.4.3",
    "softioc==4.7.1",
    "cocotb==2.0.1",
    "numpy>=2.2.4",
    "cocotbext-axi>=0.1.28"
]
license = "LicenseRef-Government-Use"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.lbl.gov/llrf-projects/pynq_llrf"

[tool.setuptools.packages.find]
where = ["."]
include = ["mimo_mts"]
exclude = ["mimo_mts.tests"]

[tool.setuptools.package-data]
"utils.clk104" = ["*.tcs"]

[project.scripts]
mimo-zcu208-ioc = "mimo_mts.ioc.app_iocs:mimo_zcu208_ioc"
mimo5g-zcu208-ioc = "mimo_mts.ioc.app_iocs:mimo5g_zcu208_ioc"
mimo-lbl208-ioc = "mimo_mts.ioc.app_iocs:mimo_lbl208_ioc"
mimo-zcu216-ioc = "mimo_mts.ioc.app_iocs:mimo_zcu216_ioc"
llrf-zcu208-ioc = "mimo_mts.ioc.app_iocs:llrf_zcu208_ioc"
llrf-lbl208-ioc = "mimo_mts.ioc.app_iocs:llrf_lbl208_ioc"
max31785 = "mimo_mts.drivers.telemetry.max31785:main"
mcrps_device = "mimo_mts.drivers.telemetry.mcrps_device:main"
