stages:
  - prepare
  - test
  - synthesis
  - release

# Run branch (push) pipelines only. Without this, a branch with an open merge request
# gets a second, merge-request pipeline for every push, duplicating the synthesis jobs.
# Branch pipelines also keep `rules: changes:` relative to the previous push; in a
# merge-request pipeline they compare against the whole MR diff and rebuild every overlay.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  XILINX_VIVADO: /non-free/Xilinx/Vivado_and_Vitis/2022.1/Vivado/2022.1
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal

image: mohs.dhcp.lbl.gov/xilinx_env_trixie_custom_verilator

lint:
  stage: test
  script:
    - pip install ruff==0.17
    - ruff check --output-format=gitlab mimo_mts designs > gl-code-quality-report.json || true
    - ruff check mimo_mts designs
    - ruff format --check mimo_mts designs
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

rtl_test:
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -e .
    - cd designs/ip/tb
  stage: test
  script:
    - make
  rules:
    - changes:
        - designs/ip/**/*

pv_docs:
  stage: test
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -e .
  script:
    # doc/PVs.md must match the PVs the IOC code creates
    - python -m mimo_mts.ioc.gen_pv_docs --check
  rules:
    - changes:
        - mimo_mts/**/*
        - designs/ip/rtl/*.json
        - pyproject.toml

# ZCU216 overlays: built when their RTL, constraints, block design or Makefile change, and on every tag.
bitfile_synthesis_zcu216:
  before_script:
    - cd designs/ZCU216/${OVERLAY}
  stage: synthesis
  timeout: 3h
  script:
    - make clean && PATH=$XILINX_VIVADO/bin:$PATH && make all
  after_script:
    # Summarize timing/utilization/power/datasheet reports, also when the build fails (runs from the repo root)
    - python3 designs/scripts/vivado_reports.py designs/ZCU216/${OVERLAY} -o designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}_report.json
      --junit designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}_timing.xml || true
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - designs/ip/rtl/*
        - designs/ZCU216/*/*.xdc
        - designs/ZCU216/*/*.tcl
        - designs/ZCU216/*/Makefile
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 4 weeks
    when: always
    paths:
      - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}.bit
      - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}.hwh
      # - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}.xsa
      - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}/${OVERLAY}.runs/{synth_1,impl_1}/*.log
      - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}/${OVERLAY}.runs/{synth_1,impl_1}/*.rpt
      - designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}_report.json
    reports:
      junit: designs/ZCU216/${OVERLAY}/_xilinx/${OVERLAY}_timing.xml
  parallel:
    matrix:
      - OVERLAY: [mimo_mts]

# ZCU208/LBL208 overlays: built when their RTL, constraints, block design or Makefile change, and on every tag
# (for the release below). The matrix lists the overlays released for each board's IOCs; others are built locally.
bitfile_synthesis_208:
  before_script:
    - cd designs/${BOARD}/${OVERLAY}
  stage: synthesis
  timeout: 3h
  script:
    - make clean && PATH=$XILINX_VIVADO/bin:$PATH && make all
  after_script:
    # Summarize timing/utilization/power/datasheet reports, also when the build fails (runs from the repo root)
    - python3 designs/scripts/vivado_reports.py designs/${BOARD}/${OVERLAY} -o designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}_report.json
      --junit designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}_timing.xml || true
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - designs/ip/rtl/*
        - designs/*208/*/*.xdc
        - designs/*208/*/*.tcl
        - designs/*208/*/Makefile
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 4 weeks
    when: always
    paths:
      - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}.bit
      - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}.hwh
      # - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}.xsa
      - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}/${OVERLAY}.runs/{synth_1,impl_1}/*.log
      - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}/${OVERLAY}.runs/{synth_1,impl_1}/*.rpt
      - designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}_report.json
    reports:
      junit: designs/${BOARD}/${OVERLAY}/_xilinx/${OVERLAY}_timing.xml
  parallel:
    matrix:
      - BOARD: [ZCU208]
        OVERLAY: [mimo_mts, mimo_mts_5g]
      - BOARD: [LBL208]
        OVERLAY: [als_llrf_mts]

# On a tag: publish the overlays built above as a GitLab release (files kept with the job, linked from the release).
# Tag only after the synthesis jobs can pass, e.g. `git tag -a v2026.2 -m "..." && git push origin v2026.2`.
release_overlays:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 designs/scripts/make_release.py
  artifacts:
    name: "overlays-$CI_COMMIT_TAG"
    expire_in: never
    paths:
      - release/
